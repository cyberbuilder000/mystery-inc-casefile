<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <title>Mystery Inc — Case File Runner</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div class="timer hidden" id="timerBar">
    <div>
      <div class="badge">Timed station</div>
      <div id="timerLabel" class="sub" style="margin:4px 0 0">—</div>
    </div>
    <div>
      <div class="clock" id="timerClock">--:--</div>
      <div id="timeUpNote" class="sub hidden" style="color:var(--bad);margin:0">Time up — you may still Continue</div>
    </div>
  </div>
  <main>
    <div id="app"></div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
